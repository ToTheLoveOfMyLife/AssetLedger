[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "assetledger"
version = "1.0.0"
description = "IT asset lifecycle API built with FastAPI and SQLAlchemy."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.10,<3"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "httpx>=0.28,<1"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
